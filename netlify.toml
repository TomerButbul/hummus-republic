# Hummus Republic — static site (no build step)
#
# URL CONTRACT
# ------------
# Printed QR codes, Google's index and inbound links all point at the paths the
# Framer site publishes. Those paths are the contract; the filenames behind them
# are an implementation detail. Every mapping below is a REWRITE (status 200),
# not a redirect: the browser keeps the canonical URL, Google keeps the ranking
# signal on one URL, and a scanned code never takes a hop it could fail on.
#
# The live path inventory (91 URLs, read from thehummusrepublic.com/sitemap.xml)
# is the source of truth. Anything in it that is NOT covered here is listed at
# the bottom as still-missing — those are real indexed pages and shipping
# without them would drop them from the index.

[build]
  publish = "."
  # Regenerates data-locations.js from the Google Sheet on every deploy, so a
  # sheet edit reaches the site without anyone touching code. Baked at build
  # time rather than fetched in the browser because addresses and hours are
  # what these 53 pages rank for, and a crawler is not guaranteed to wait for
  # a fetch. A sheet problem prints in the build log but does not fail the
  # deploy — a bad cell should not block an unrelated release.
  command = "node build/locations.js && node build/menu-pages.js && node build/seo.js"

# ---------------------------------------------------------------------------
# Live paths -> files that already exist in this repo
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/about-us"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/accessibility-statement"
  to = "/accessibility.html"
  status = 200

[[redirects]]
  from = "/careers"
  to = "/careers.html"
  status = 200

[[redirects]]
  from = "/contact-us"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/franchise-opportunities"
  to = "/franchise.html"
  status = 200

[[redirects]]
  from = "/hummus-republic-menu"
  to = "/menu.html"
  status = 200

# 19 indexed menu item pages, each generated as its own static file so it has
# its own title, description and H1. A single template reading a query string
# would give nineteen dishes one set of metadata and Google would rank none.
[[redirects]]
  from = "/hummus-republic-menu/:slug"
  to = "/menu/:slug.html"
  status = 200

[[redirects]]
  from = "/locations-main"
  to = "/locations.html"
  status = 200

# 55 location pages. The rewrite hands the slug through as ?id= so
# location.html reads it exactly as it does today, while the visitor and
# Google both keep /locations/<slug>.
# Stores that are gone but whose pages are still live and indexed today.
# Checked against the sheet: burbank-ca and surprise-az are not in it at all,
# roswell-ga and tampa-fl are Status = Closed. All four currently send
# customers to shut doors.
#
# 301 rather than 404: these URLs have inbound links and ranking history, and
# a permanent redirect passes that to the locator while putting a real person
# one click from a store that is actually open. A 404 throws both away.
[[redirects]]
  from = "/locations/burbank-ca"
  to = "/locations-main"
  status = 301

[[redirects]]
  from = "/locations/surprise-az"
  to = "/locations-main"
  status = 301

[[redirects]]
  from = "/locations/roswell-ga"
  to = "/locations-main"
  status = 301

[[redirects]]
  from = "/locations/tampa-fl"
  to = "/locations-main"
  status = 301

[[redirects]]
  from = "/locations/:slug"
  to = "/location.html?id=:slug"
  status = 200

# Partner landing. QR-CRITICAL: printed codes point at
#   /perks?p=<slug>            (members)
#   /perks?p=<slug>&k=<code>   (employees)
# The query string is preserved through a rewrite automatically, so the page
# reads ?p= exactly as the printed code wrote it.
[[redirects]]
  from = "/hummus-u-plus"
  to = "/hummus-u-plus.html"
  status = 200

[[redirects]]
  from = "/news-media"
  to = "/news-media.html"
  status = 200

[[redirects]]
  from = "/order-now"
  to = "/order-now.html"
  status = 200

[[redirects]]
  from = "/perks"
  to = "/perks.html"
  status = 200

[[redirects]]
  from = "/partners"
  to = "/partners.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/rewards.html"
  status = 200

[[redirects]]
  from = "/privacynotice"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/termsofservice"
  to = "/terms.html"
  status = 200

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------
# Working directories live alongside the site because publish = ".", and the
# CLI uploads the folder rather than what git tracks. None of these should be
# reachable over HTTP: /build is the generators, /.claude is editor config,
# /.playwright-mcp is console logs from local debugging.
[[redirects]]
  from = "/build/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/.playwright-mcp/*"
  to = "/"
  status = 404
  force = true

# ############################################################
# PREVIEW GUARD — REMOVE THIS BLOCK BEFORE GOING LIVE
# ############################################################
# This deploy is a full copy of a site that is already live and ranking.
# Left indexable on a *.netlify.app host it becomes a duplicate of
# thehummusrepublic.com competing with the original, and Google may pick the
# wrong one as canonical. noindex until this deploy IS the real domain.
#
# To go live: delete this header block, then redeploy.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# The stylesheet and scripts are referenced without a content hash, so they
# cannot be immutable for a year — a deploy would not reach anyone who had
# visited before. Revalidation keeps deploys effective and stays cheap.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# STILL MISSING — do NOT go live until these exist.
# Each is a live, indexed URL today. Launching without them drops the page
# from Google and, for /perks, breaks every printed partner QR code.
#
#
# There is deliberately no catch-all 404 rewrite here: a wrong guess would
# return 200 for a URL that should 404, and Google treats that as a soft-404
# across the whole site.
# ---------------------------------------------------------------------------
