<body data-page="perks">

<a class="skip" href="#perk-main">Skip to content</a>

<main id="perk-main" class="perk" aria-busy="true">

  <!-- Async region. Everything below is replaced once the sheet answers;
       aria-live means a screen reader is told when that happens rather than
       being left on a silent page. -->
  <div id="perk-state" class="perk__state wrap" role="status" aria-live="polite">
    <div class="perk__spinner" aria-hidden="true"></div>
    <p class="perk__loading">Loading your offer…</p>
  </div>

  <div id="perk-body" hidden></div>

</main>

<noscript>
  <div class="wrap perk__noscript">
    <h1 class="h-2">Partner perks</h1>

       You can still <a class="textlink" href="https://order.thehummusrepublic.com/find-location">order online</a>
       or <a class="textlink" href="locations.html">find a location</a>.</p>
  </div>
</noscript>
